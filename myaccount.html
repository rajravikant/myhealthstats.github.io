<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Account</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins&display=swap");

      * {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        box-sizing: border-box;
      }

      .setBackground {
        background-image: url(./bgimages/unsplash.jpg);
        background-size: cover;
        backdrop-filter: blur(2px);
        background-repeat: no-repeat;
        height: 100vh;
        width: 100%;
      }

      .setBackContainer {
        background: url(./bgimages/unsplash.jpg) rgba(0, 0, 0,0.12);
        background-size: cover;
        background-blend-mode:darken;
        box-shadow: 0 2.8px 2.2px rgba(0, 0, 0, 0.034),
          0 6.7px 5.3px rgba(0, 0, 0, 0.048), 0 12.5px 10px rgba(0, 0, 0, 0.06),
          0 22.3px 17.9px rgba(0, 0, 0, 0.072),
          0 41.8px 33.4px rgba(0, 0, 0, 0.086), 0 100px 80px rgba(0, 0, 0, 0.12);
      }

      .my-account-container {
        display: flex;
        flex-direction: column;
        min-height: 60vh;
        width: 370px;
        margin: 100px auto;
        padding: 30px;
        align-items: center;
        border-radius: 15px;
        gap: 20px;
        justify-content: flex-start;
      }

      header {
        display: flex;
        height: 60px;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background-color: #124a52;
      }

      header h1 {
        color: white;
      }

      .links a{
        text-decoration: none;
        color: white;
      }

      .login-form input {
        margin: 10px;
        padding: 10px;
        width: 300px;
        border: none;
        border-radius: 10px;
        /* box-sizing: border-box; */
        /* box-shadow: 0 0 5px 0.5px grey; */
       outline: 0;
       
        box-shadow: 0 2.8px 2.2px rgba(0, 0, 0, 0.5),
          0 6.7px 5.3px rgba(0, 0, 0, 0.048), 0 12.5px 10px rgba(0, 0, 0, 0.06),
          0 22.3px 17.9px rgba(0, 0, 0, 0.072),
          0 41.8px 33.4px rgba(0, 0, 0, 0.086), 0 100px 80px rgba(0, 0, 0, 0.12);

          font-size: 15px;
          text-align: left;

      }

    

      .account-buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    .btn-login {
        text-transform: uppercase;
        padding: 10px;
        width: 130px;
        border: 2px white solid;
        border-radius: 100px;
        color: white;
        background-color: transparent ;
        box-shadow: 0 0 2px 0.5px #a0a0a0;
        transition: 0.3s;
        }

      .btn-login:hover{
        background-color: #54b5c2;
        border: none;
        cursor: pointer;
        box-shadow: 0 0.5em 0.5em -0.4em;
        transform: translateY(-0.25em);
        outline: 0;
      }

      .login-heading{
        color: white;
        font-size: 30px;
        font-weight: bold;
      }

      .forget-password p{
        color: white;
        text-decoration: underline;
        text-transform: uppercase;
        padding-top: 10px;
      }

      @media (max-width:768px) {

        .my-account-container{

            min-height: 60vh;
            width: 300px;
            margin: 100px auto;
            padding: 10px;
            align-items: center;
        }

        .login-form input{
            margin: 10px;
            padding: 10px;
            width: 250px;
        }


        .account-buttons{
            flex-direction: column;

        }

        .btn-login{
            
            width: 150px;
            gap: 30px;
        }

        header h1{
            font-size: 25px;
        }

      }


    </style>
  </head>
  <body class="setBackground">
    <header>
      <div class="header-title">
        <h1>MYHEALTHSTATS</h1>
      </div>
      <div class="links">
        <a href="./index.html" target="_parent"><h3>Home</h3></a>
      </div>
    </header>

    <main>
      <section class="my-account-container setBackContainer">
        <div class="login-heading">User Login</div>

        <div class="account-inputs">
          <form class="login-form">
            <input
              type="text"
              name="username"
              id="us"
              placeholder="email or phone number"
            /><br />

            <input
              type="password"
              name="username"
              id="pw"
              placeholder="password"
            />
          </form>
        </div>

        <div class="account-buttons">
          <button type="submit" class="btn-login">Sign in</button>
          <button type="reset" class="btn-Reset btn-login">Sign up</button>
        </div>

        <div class="forget-password">
            <a href="#"><p>forgot password</p></a>
        </div>
      </section>
    </main>
  </body>
</html>
