<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <section class="bmi-calc">
            <p>Health Tools</p>
            <h1>BMI CALCULATOR</h1>
            <p>Body Mass Index Calculator</p>

            <div class="container">
                    <form action="#">
                        <input type="text" placeholder="age">
                        <label for="s">male</label>
                        <label for="ss">female</label>
                        <input type="radio" name="s" id="s">
                        <input type="radio" name="ss" id="ss">
                    </form>
            </div>
        </section>
    </main>
</body>
</html>

<style>

    display: flex;

    justify-content: center;

    padding: 20px;

    display: flex;
